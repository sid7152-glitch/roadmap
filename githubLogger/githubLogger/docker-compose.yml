services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: github_logger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # We override the localhost URL here!
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/github_logger
    depends_on:
      - db